[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardiao"
version = "0.5.0"
description = "Scanner de segredos vazados em código-fonte e histórico Git — regex + entropia, baseline, SARIF e hook de pre-commit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paulo Marcos Lucio" }]
keywords = ["security", "secrets", "secret-scanning", "appsec", "sast", "sarif", "pre-commit", "owasp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  # Piso mínimo em 0.16 por SEGURANÇA, não capricho: até a 0.12.5,
  # `pretty_exceptions_show_locals` vinha ligado por padrão e o VALOR de um segredo
  # aparecia cru no traceback (locais do frame). O `cli.py` também passa o parâmetro
  # explicitamente — cinto e suspensório. Testado com a 0.27 desta árvore.
  "typer>=0.16",
  "rich>=13.7",
  # tomllib é stdlib a partir do 3.11; o piso do projeto é 3.10 (ver
  # requires-python), que precisa do backport para --regras/--gitleaks-config.
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Pisos elevados para as versões efetivamente instaladas e testadas neste repo
# (portões verdes em 2026-08-04): assim os PRs do Dependabot que só sobem o piso
# ficam redundantes e o CI reproduz o ambiente medido.
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "mypy>=2.3",
  # Testes property-based: geram milhares de entradas e afirmam INVARIANTES de classe,
  # não só os exemplos que alguém pensou. É a rede contra "defeito de classe" — foi um
  # corpo base64 de PEM (821 FP num cacert.pem) que nenhum fixture cobria.
  "hypothesis>=6.100",
  # Sem marcador (ao contrário da dependência de runtime acima): o mypy do
  # projeto fixa `python_version = "3.10"` para toda a matriz de CI, então
  # ele sempre resolve o ramo `tomli` de `rules/external.py`/`rules/gitleaks.py`
  # — inclusive rodando sob 3.11+, onde o marcador de runtime não instalaria
  # o pacote.
  "tomli>=2.0.1",
]

[project.urls]
Homepage = "https://github.com/Paulo-Marcos-Lucio/guardiao"
Repository = "https://github.com/Paulo-Marcos-Lucio/guardiao"

[project.scripts]
guardiao = "guardiao.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardiao"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Fixtures do corpus de referência são deliberadamente "sujos": segredos sintéticos,
# literais soltos e formatação atípica são o objeto de teste, não descuido.
extend-exclude = ["bench/positivos", "bench/negativos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer exige `= typer.Option(...)` nos defaults (padrão do framework).
"src/guardiao/cli.py" = ["B008"]

[tool.ruff.lint.isort]
# Deixa a categorização determinística entre ambientes (local e CI).
known-first-party = ["guardiao", "tests"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
files = ["src"]

[[tool.mypy.overrides]]
module = ["typer.*", "rich.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# O portão de cobertura é ANTI-REGRESSÃO: fixado abaixo do medido hoje (95%), nunca
# acima. Fica no pyproject para que `pytest` local e o CI rodem exatamente a mesma coisa.
addopts = "-q --strict-markers --cov=guardiao --cov-report=term-missing --cov-fail-under=90"
