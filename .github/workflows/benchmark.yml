name: Benchmark

on:
  push:
    branches: [main]
  pull_request:

# Padrão restritivo no topo; cada job reafirma o mínimo que precisa.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portao-anti-regressao:
    name: Portão anti-regressão (FP/1k e recall vs. bench/limpo/teto.json)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Materializa fixtures de formato sensível do corpus
        run: python bench/gerar.py
      - name: Varre o corpus de referência
        # --fail-on none: o corpus TEM segredos de propósito (positivos/); quem decide
        # verde/vermelho aqui é o portão, não o --fail-on do scan.
        run: guardiao scan bench -f json -o resultado.json --fail-on none
      - name: Compara contra o teto versionado
        run: python bench/portao.py resultado.json
