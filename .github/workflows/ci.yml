name: CI

on:
  push:
    branches: [main]
  pull_request:

# Padrão restritivo no topo; cada job reafirma o mínimo que precisa.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint · Tipos · Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Actions fixadas por SHA: uma tag é um ponteiro móvel, e o próprio Esteira
      # (a ferramenta irmã) reprova CI que não faz isto.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest

  autoauditoria:
    name: Guardião varre o próprio código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # sem isto o --git-history enxerga só o último commit
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Varredura (o próprio código-fonte deve estar limpo)
        # Varre apenas src/ — tests/ contém segredos sintéticos de propósito.
        run: guardiao scan src -f sarif -o guardiao.sarif --fail-on high
      - name: Publica SARIF no Code Scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: guardiao.sarif

  dependency-review:
    name: Revisão de dependências (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Só faz sentido num PR: compara a base com o HEAD do PR.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Barra dependências novas com vulnerabilidade conhecida
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
